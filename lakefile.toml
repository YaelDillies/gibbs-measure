name = "GibbsMeasure"
keywords = ["math", "probability", "measure-theory", "statistical-physics", "percolation", "ising-model"]
defaultTargets = ["GibbsMeasure"]

[leanOptions]
# Pretty-prints `fun a ↦ b`
pp.unicode.fun = true
# Don't assume a typo is a new variable
autoImplicit = false
relaxedAutoImplicit = false
# Enable all mathlib linters: automatically matches what mathlib uses...
weak.linter.mathlibStandardSet = true
# ...except the header linter.
weak.linter.style.header = false
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "dde636144bc5f6b528d558085d24c8f243430afc"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "GibbsMeasure"
